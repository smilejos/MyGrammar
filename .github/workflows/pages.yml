name: Build and deploy Grammar Journey
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build static HTML
        run: python3 scripts/build.py
      - name: Validate curriculum, links and print outputs
        run: python3 tests/validate.py
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
